<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>InDebtEd Brand NPCs</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@1,700&family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: brand district console, same frame as the consumables viewer. Low-res viewport left, spec sheet right; stacks on phones. The active brand's 950–100 scale is the whole world, swapped in by script. */
:root{
  --b950:#0D0900; --b900:#1A1200; --b800:#3D2C00; --b700:#6B4C00; --b600:#A87800;
  --b500:#FFD24A; --b400:#FFDC72; --b300:#FFE89B; --b200:#FFF1C2; --b100:#FFFAE8;
  --shade:#5A1AAD;
  --white:#F0F0F0; --chalk:#B0B0B0;
  --display:'Bebas Neue','Arial Narrow',Impact,sans-serif; --dweight:400; --dtrack:.01em;
  --tagfont:'Cormorant Garamond',Georgia,serif; --tagstyle:italic; --tagweight:700;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--b950);color:var(--white)}
body{font-family:var(--mono);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 36px;transition:background-color .2s}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--b700);padding-bottom:16px}
header img{width:56px;height:56px;image-rendering:pixelated;box-shadow:6px 6px 0 var(--shade);display:block}
h1{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:900;font-size:clamp(36px,6vw,62px);line-height:.85;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{font-size:11px;letter-spacing:.18em;color:var(--chalk);text-transform:uppercase;margin-top:8px}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.brand{--s:#FF3B2F;--bg:#1A0300;--bd:#6B0D00;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--white);background:var(--bg);border:2px solid var(--bd);border-top:8px solid var(--bd);padding:10px 12px 9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-weight:400;font-size:10px;color:var(--chalk);letter-spacing:.12em}
.brand:hover{border-color:var(--s)}
.brand[aria-pressed="true"]{border-top-color:var(--s)}
@media (max-width:520px){.brands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:var(--dweight);font-size:22px;line-height:1;letter-spacing:.06em;color:var(--white);background:var(--b900);border:2px solid var(--b700);border-left:8px solid var(--b800);padding:8px 14px 6px 11px;cursor:pointer}
.tab:hover{border-color:var(--b400);border-left-color:var(--b400)}
.tab[aria-pressed="true"]{background:var(--b800);border-left-color:var(--b500)}
.tab:focus-visible,.tog:focus-visible,.brand:focus-visible,.chip:focus-visible{outline:2px solid var(--b300);outline-offset:2px}
.view{position:relative;border:6px solid var(--b700);background:var(--b950);aspect-ratio:4/3;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.view canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
.hud{position:absolute;font-size:11px;letter-spacing:.14em;color:var(--white);text-shadow:2px 2px 0 var(--b950);pointer-events:none;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud.tl{left:12px;top:10px}.hud.tr{right:12px;top:10px;color:var(--chalk)}
.hud.bl{left:12px;bottom:10px;color:var(--chalk)}.hud.br{right:12px;bottom:10px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--chalk);font-size:13px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.controls .label{font-size:11px;letter-spacing:.16em;color:var(--chalk);text-transform:uppercase;margin-right:4px;min-width:64px}
.tog{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk);background:var(--b900);border:2px solid var(--b800);padding:7px 10px;cursor:pointer}
.tog:hover{border-color:var(--b400)}
.tog[aria-pressed="true"]{color:var(--white);border-color:var(--b600)}
.tog:disabled{opacity:.4;cursor:default}
.build{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px;align-items:center;background:var(--b900);border:2px solid var(--b800);padding:10px}
.build .label{font-size:11px;letter-spacing:.16em;color:var(--chalk);text-transform:uppercase;padding-right:6px}
.build .head{grid-column:1/-1;font-size:11px;letter-spacing:.16em;color:var(--b200);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{--s:#fff;--bg:#000;--bd:#333;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--chalk);background:var(--bg);border:2px solid var(--bd);border-left:6px solid var(--bd);padding:6px 6px;cursor:pointer;min-width:0}
.chip:hover{border-color:var(--s)}
.chip[aria-pressed="true"]{color:var(--white);border-left-color:var(--s)}
.sheet{background:var(--b900);border:2px solid var(--b700);border-left:8px solid var(--b500);padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lot{font-size:11px;letter-spacing:.18em;color:var(--b200);text-transform:uppercase}
.sheet h2{font-family:var(--display);font-weight:var(--dweight);letter-spacing:var(--dtrack);font-size:96px;line-height:.82;margin:0;color:var(--b100);text-shadow:7px 7px 0 var(--b950);white-space:nowrap}
.tagline{font-family:var(--tagfont);font-style:var(--tagstyle);font-weight:var(--tagweight);font-size:28px;line-height:1.05;color:var(--b200);text-wrap:balance}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;border-top:2px solid var(--b700);padding-top:14px}
dt{font-size:11px;letter-spacing:.14em;color:var(--b200);text-transform:uppercase;padding-top:2px}
dd{margin:0;font-size:13px;line-height:1.45;color:var(--b100)}
.mount{border:2px solid var(--b200);padding:10px 12px;font-size:12px;line-height:1.5;color:var(--b200)}
.mount b{color:var(--b100)}
.specs{font-size:11px;line-height:1.7;letter-spacing:.06em;color:var(--chalk);border-top:2px solid var(--b800);padding-top:12px;font-variant-numeric:tabular-nums}
.specs span{color:var(--white)}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

    p.xy+=(vec2(hh(q),hh(q+1.7))-0.5)*uJitter*4.0/uRes*p.w*step(0.8,hh(position*1.3+t*0.37));}

const NPC={gld:npcGLD,red:npcRED,blu:npcBLU,grn:npcGRN};
const ND={
  gld:{name:'DEACON',lot:'GLD // RADIANCE CONGREGATION',tag:'Peace be upon your balance.',
    rows:[['Built from','Diamonds and 45° cuts: an octahedron head, chevron chest, flared robe and a diamond halo.'],['Silhouette','Hourglass with a halo. Narrow waist, wide hem.'],['Purple','Stole, sash and head band, plus the shadow tint. Nowhere else.'],['Carries','GLD Pistol: Pistol frame, Cycle chamber, Fast barrel, GLD ammo.'],['Director fit','Taunt. Stands near upgrades and pickups as bait.']]},
  red:{name:'CONTRACTOR',lot:'RED // FIRE SECURITY',tag:'Contract extended indefinitely.',

  blu:{name:'SPECIALIST',lot:'BLU // ZAP CAPABILITIES',tag:'nature undisclosed.',

  grn:{name:'ASSOCIATE',lot:'GRN // GROWTH TASK FORCE',tag:'We are aware. A task force has been formed.',
    rows:[['Built from','Overlapping cubes of equal size. The torso is the logo\'s 2×2 grid, checker block included.'],['Silhouette','Chunky and stepped, like a stack of boxes.'],['Detail','Lanyard badge. The cap block shuffles every few seconds.'],['Carries','GRN Full-Auto: Full-Auto frame, Burst chamber, Slow barrel, Investment ammo.'],['Director fit','Drain. Cheap sustained fire that makes the player spend.']]}
};
const NOTE='<b>Proposed, not locked.</b> Names, Director fits and weapons are suggestions. Debt collectors carry the lender\'s brand, so each body could double as that brand\'s collector with a different tool in hand.';

const floors={},items={};
function build(){
  BRANDS.forEach((bk,i)=>{B=BR[bk];
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(120,120,40,40),M(T(32,32,STAGE[bk].floor),[60,60]));fl.rotation.x=-Math.PI/2;fl.position.y=-0.36;scene.add(fl);floors[bk]=fl;
    const root=new THREE.Group(),spin=new THREE.Group(),npc=NPC[bk]();spin.rotation.y=0.35;spin.add(npc);root.add(spin);root.add(pedestal());scene.add(root);
    items[bk]={root,spin,npc,tris:triCount(npc),anims:collect(npc),ctrl:npc.userData.gun.userData.ctrl};});
  B=BR.gld;apply();
}

/* ---------- state + UI ---------- */
const $=id=>document.getElementById(id);
let brand='gld',lineup=false,armed=true,shooting=false,hi=false;
let spinOn=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let theta=0,phi=0.1,dragging=false,lx=0,ly=0;
function setPressed(el,v){el.setAttribute('aria-pressed',v?'true':'false');}
function renderBrands(){const el=$('brands');BRANDS.forEach(bk=>{const b=BR[bk],btn=document.createElement('button');btn.className='brand';btn.dataset.b=bk;
  btn.style.setProperty('--s',b.pal[500]);btn.style.setProperty('--bg',b.pal[900]);btn.style.setProperty('--bd',b.pal[700]);
  btn.innerHTML=b.name+'<small>'+b.corp+' · '+ND[bk].name+'</small>';btn.onclick=()=>{brand=bk;apply();};el.appendChild(btn);});}
function fitName(){const h=$('s-name'),max=96;h.style.fontSize=max+'px';const avail=h.parentElement.clientWidth-48;let s=max;while(h.scrollWidth>avail&&s>36){s-=4;h.style.fontSize=s+'px';}}
function apply(){
  if(!items.gld)return;
  const b=BR[brand],d=ND[brand],root=document.documentElement.style;
  [950,900,800,700,600,500,400,300,200,100].forEach(n=>root.setProperty('--b'+n,b.pal[n]));
  root.setProperty('--shade',b.shadow||b.pal[700]);Object.entries(b.css).forEach(([n,v])=>root.setProperty('--'+n,v));
  $('logo').src=LOGO[brand];$('logo').alt=b.name+' logo';
  document.querySelectorAll('.brand').forEach(x=>setPressed(x,x.dataset.b===brand));
  BRANDS.forEach((bk,i)=>{const it=items[bk];it.root.visible=lineup||bk===brand;it.root.position.x=lineup?(i-1.5)*6.2:0;floors[bk].visible=bk===brand;
    it.npc.userData.gun.visible=armed;});
  scene.background.set(b.pal[950]);U.uFogColor.value.set(b.pal[950]);
  $('s-lot').textContent=d.lot;$('s-name').textContent=d.name;$('s-tag').textContent=d.tag;
  $('s-dl').innerHTML=d.rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');$('s-mount').innerHTML=NOTE;
  const tris=lineup?BRANDS.reduce((s,k)=>s+items[k].tris,0):items[brand].tris;
  $('hud-name').textContent=(lineup?'ALL BRANDS // LINEUP':b.name+' // '+d.name)+(shooting?' // FIRING':'');$('hud-tris').textContent='TRIS '+tris;
  const W=hi?640:320,H=hi?480:240;$('hud-res').textContent=W+'×'+H+' // 15-BIT';
  $('s-specs').innerHTML=b.note+'<br>Model <span>'+tris+' tris</span>'+(armed?' incl. weapon':'')+' · textures <span>≤96px</span>, nearest filter, no mipmaps<br>'+
    'Vertex snap <span>'+(U.uSnap.value?'on':'off')+'</span> · affine UVs <span>'+(U.uAffine.value?'on':'off')+'</span> · Bayer dither <span>'+(U.uDither.value?'on':'off')+'</span>'+
    (b.jitter?' · vertex drift <span>always on</span>':'')+(b.shadow?' · shadow tint <span>Purple-700</span>':'');
  setPressed($('t-line'),lineup);setPressed($('t-spin'),spinOn);setPressed($('t-arm'),armed);setPressed($('t-shoot'),shooting);
  setPressed($('t-res'),!hi);$('t-res').textContent=hi?'480p':'240p';
  setPressed($('t-wob'),!!U.uSnap.value);setPressed($('t-aff'),!!U.uAffine.value);setPressed($('t-dit'),!!U.uDither.value);
  renderer.setSize(W,H,false);U.uRes.value.set(W,H);U.uFogNear.value=lineup?24:10;U.uFogFar.value=lineup?60:26;
  fitName();
}
$('t-spin').onclick=()=>{spinOn=!spinOn;apply();};
$('t-arm').onclick=()=>{armed=!armed;if(!armed)shooting=false;apply();};
$('t-shoot').onclick=()=>{shooting=!shooting;if(shooting)armed=true;apply();};
$('t-line').onclick=()=>{lineup=!lineup;apply();};
$('t-res').onclick=()=>{hi=!hi;apply();};
$('t-wob').onclick=()=>{U.uSnap.value=U.uSnap.value?0:1;apply();};
$('t-aff').onclick=()=>{U.uAffine.value=U.uAffine.value?0:1;apply();};
$('t-dit').onclick=()=>{U.uDither.value=U.uDither.value?0:1;apply();};
window.addEventListener('resize',fitName);
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lx)*0.008;phi=Math.max(-0.08,Math.min(0.85,phi+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
const end=()=>{dragging=false;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

let last=performance.now(),clock=0;
function frame(now){
  if(!items.gld){requestAnimationFrame(frame);return;}
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;U.uTime.value=clock;
  BRANDS.forEach(bk=>{const it=items[bk];if(!it.root.visible)return;it.ctrl.on=shooting&&armed;stepCtrl(it.ctrl,dt);it.anims.forEach(a=>a(clock,it.ctrl));
    if(spinOn&&!dragging)it.spin.rotation.y+=dt*0.45;it.spin.position.y=Math.sin(clock*1.6+bk.length)*0.015;});
  const r=lineup?26:9.4,ty=lineup?2.0:2.05;
  camera.position.set(Math.sin(theta)*Math.cos(phi)*r,ty+Math.sin(phi)*r,Math.cos(theta)*Math.cos(phi)*r);
  camera.lookAt(0,ty,0);camera.updateMatrixWorld();
  U.uLight.value.copy(lightW).transformDirection(camera.matrixWorldInverse);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
renderBrands();
const faces=['900 48px "Barlow Condensed"','800 12px "Barlow Condensed"','400 40px "Bebas Neue"','italic 700 20px "Cormorant Garamond"',
  '500 16px "DM Sans"','700 16px "DM Sans"','500 16px "DM Mono"','400 12px "Space Mono"'];
Promise.race([Promise.all(faces.map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>{build();requestAnimationFrame(frame);});
})();

</script>
