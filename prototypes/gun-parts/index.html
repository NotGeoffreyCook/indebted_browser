<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: brand district console, same frame as the consumables viewer. Low-res viewport left, spec sheet right; stacks on phones. The active brand's 950–100 scale is the whole world, swapped in by script. */
:root{
  --b950:#0D0900; --b900:#1A1200; --b800:#3D2C00; --b700:#6B4C00; --b600:#A87800;
  --b500:#FFD24A; --b400:#FFDC72; --b300:#FFE89B; --b200:#FFF1C2; --b100:#FFFAE8;
  --shade:#5A1AAD;
  --white:#F0F0F0; --chalk:#B0B0B0;
  --display:'Bebas Neue','Arial Narrow',Impact,sans-serif; --dweight:400; --dtrack:.01em;
  --tagfont:'Cormorant Garamond',Georgia,serif; --tagstyle:italic; --tagweight:700;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--b950);color:var(--white)}
body{font-family:var(--mono);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 36px;transition:background-color .2s}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--b700);padding-bottom:16px}
header img{width:56px;height:56px;image-rendering:pixelated;box-shadow:6px 6px 0 var(--shade);display:block}
h1{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:900;font-size:clamp(36px,6vw,62px);line-height:.85;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{font-size:11px;letter-spacing:.18em;color:var(--chalk);text-transform:uppercase;margin-top:8px}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.brand{--s:#FF3B2F;--bg:#1A0300;--bd:#6B0D00;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--white);background:var(--bg);border:2px solid var(--bd);border-top:8px solid var(--bd);padding:10px 12px 9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-weight:400;font-size:10px;color:var(--chalk);letter-spacing:.12em}
.brand:hover{border-color:var(--s)}
.brand[aria-pressed="true"]{border-top-color:var(--s)}
@media (max-width:520px){.brands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:var(--dweight);font-size:22px;line-height:1;letter-spacing:.06em;color:var(--white);background:var(--b900);border:2px solid var(--b700);border-left:8px solid var(--b800);padding:8px 14px 6px 11px;cursor:pointer}
.tab:hover{border-color:var(--b400);border-left-color:var(--b400)}
.tab[aria-pressed="true"]{background:var(--b800);border-left-color:var(--b500)}
.tab:focus-visible,.tog:focus-visible,.brand:focus-visible,.chip:focus-visible{outline:2px solid var(--b300);outline-offset:2px}
.view{position:relative;border:6px solid var(--b700);background:var(--b950);aspect-ratio:4/3;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.view canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
.hud{position:absolute;font-size:11px;letter-spacing:.14em;color:var(--white);text-shadow:2px 2px 0 var(--b950);pointer-events:none;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud.tl{left:12px;top:10px}.hud.tr{right:12px;top:10px;color:var(--chalk)}
.hud.bl{left:12px;bottom:10px;color:var(--chalk)}.hud.br{right:12px;bottom:10px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--chalk);font-size:13px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.controls .label{font-size:11px;letter-spacing:.16em;color:var(--chalk);text-transform:uppercase;margin-right:4px;min-width:64px}
.tog{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk);background:var(--b900);border:2px solid var(--b800);padding:7px 10px;cursor:pointer}
.tog:hover{border-color:var(--b400)}
.tog[aria-pressed="true"]{color:var(--white);border-color:var(--b600)}
.tog:disabled{opacity:.4;cursor:default}
.build{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:6px;align-items:center;background:var(--b900);border:2px solid var(--b800);padding:10px}
.build .label{font-size:11px;letter-spacing:.16em;color:var(--chalk);text-transform:uppercase;padding-right:6px}
.build .head{grid-column:1/-1;font-size:11px;letter-spacing:.16em;color:var(--b200);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip{--s:#fff;--bg:#000;--bd:#333;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--chalk);background:var(--bg);border:2px solid var(--bd);border-left:6px solid var(--bd);padding:6px 6px;cursor:pointer;min-width:0}
.chip:hover{border-color:var(--s)}
.chip[aria-pressed="true"]{color:var(--white);border-left-color:var(--s)}
.models .chip{white-space:normal;text-align:left;line-height:1.25;overflow-wrap:anywhere}
.models .chip small{display:block;font-weight:400;font-size:9px;color:var(--chalk);letter-spacing:.12em}
.sheet{background:var(--b900);border:2px solid var(--b700);border-left:8px solid var(--b500);padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lot{font-size:11px;letter-spacing:.18em;color:var(--b200);text-transform:uppercase}
.sheet h2{font-family:var(--display);font-weight:var(--dweight);letter-spacing:var(--dtrack);font-size:96px;line-height:.82;margin:0;color:var(--b100);text-shadow:7px 7px 0 var(--b950);white-space:nowrap}
.tagline{font-family:var(--tagfont);font-style:var(--tagstyle);font-weight:var(--tagweight);font-size:28px;line-height:1.05;color:var(--b200);text-wrap:balance}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;border-top:2px solid var(--b700);padding-top:14px}
dt{font-size:11px;letter-spacing:.14em;color:var(--b200);text-transform:uppercase;padding-top:2px}
dd{margin:0;font-size:13px;line-height:1.45;color:var(--b100)}
.mount{border:2px solid var(--b200);padding:10px 12px;font-size:12px;line-height:1.5;color:var(--b200)}
.mount b{color:var(--b100)}
.specs{font-size:11px;line-height:1.7;letter-spacing:.06em;color:var(--chalk);border-top:2px solid var(--b800);padding-top:12px;font-variant-numeric:tabular-nums}
.specs span{color:var(--white)}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

    p.xy+=(vec2(hh(q),hh(q+1.7))-0.5)*uJitter*4.0/uRes*p.w*step(0.8,hh(position*1.3+t*0.37));}

function makeCtrl(b){return {b,on:false,declined:false,shots:0,since:99,attempts:0,aSince:99,ok:true,charge:0,phase:0,next:0,k:0,fired:0};}
function stepCtrl(c,dt){c.fired=0;c.since+=dt;c.aSince+=dt;
  if(!c.on){c.phase=0;c.next=0;c.k=0;c.charge=Math.max(0,c.charge-dt*2.5);return;}
  const P=FIREP[c.b],fire=()=>{c.attempts++;c.aSince=0;c.ok=!c.declined;if(c.ok){c.shots++;c.since=0;c.fired++;}};c.phase+=dt;
  if(c.b==='blu'){if(c.phase<P.charge)c.charge=c.phase/P.charge;else{if(!c.k){fire();c.k=1;}c.charge=Math.max(0,1-(c.phase-P.charge)/0.15);}
    if(c.phase>=P.charge+P.cool){c.phase=0;c.k=0;}return;}
  while(c.k<P.n&&c.phase>=c.next){fire();c.k++;c.next+=P.p;}
  if(c.k>=P.n&&c.phase>=P.n*P.p+P.pause){c.phase=0;c.k=0;c.next=0;}
}

/* brand muzzle flash, projectiles in the ammo brand, and a receipt printed per cleared round from the chamber's left side */
function gunFx(g,body,sel,parts,ctrl){
  const P=FIREP[sel.frame],BF=BFX[sel.barrel],brl=parts[2].h,MZ=brl.children[0].userData.muzzle||BF.m;
  const FL=new THREE.Group();FL.position.set(MZ+0.04,0,0);brl.add(FL);
  const flash=withBrand(sel.barrel,()=>FLASH[sel.barrel](FL));fxMark(FL);FL.visible=false;FL.scale.setScalar(0.001);
  const pm=withBrand(sel.ammo,()=>solid(400)),geo=new THREE.BoxGeometry(1,1,1),shots=[];
  for(let i=0;i<24;i++){const m=new THREE.Mesh(geo,pm);m.visible=false;m.scale.setScalar(0.001);m.position.set(1.4+MZ,2,0);g.add(fxMark(m));shots.push({m,v:new THREE.Vector3(),life:0});}
  const anchor=parts[1].h.children[0].userData.anchor;
  const rmat=withBrand(sel.ammo,()=>C('receipt',16,16,(c,w,h)=>{R(c,100,0,0,w,h);for(let y=2;y<h-1;y+=3)R(c,700,2,y,(y*5)%8+5,1);R(c,300,w-3,0,1,h);}));
  const rgeo=new THREE.BoxGeometry(0.24,0.012,0.1);rgeo.translate(0,0,-0.05);const rec=[];
  for(let i=0;i<6;i++){const root=new THREE.Group(),segs=[];let par=root;
    for(let j=0;j<20;j++){const piv=new THREE.Group();par.add(piv);const m=new THREE.Mesh(rgeo,rmat);m.visible=false;m.scale.setScalar(0.001);piv.add(m);segs.push({piv,m});par=piv;}
    root.visible=false;anchor.add(fxMark(root));rec.push({root,segs,L:0,target:0,mode:'off',v:new THREE.Vector3(),life:0,seed:i*1.7});}
  const layout=(r,t)=>{const n=Math.ceil(r.L/0.1-1e-6);
    r.segs.forEach((q,j)=>{q.m.visible=j<n;q.m.scale.set(1,1,j<n-1?1:Math.max(0.01,r.L/0.1-(n-1)));q.piv.position.z=j?-0.1:0;
      q.piv.rotation.x=j?(r.mode==='fall'?-0.18+Math.sin(t*7+j*0.9+r.seed)*0.22:-0.13):0;});};
  const reset=r=>{anchor.add(r.root);r.root.position.set(0,0,0);r.root.rotation.set(0,0,0);r.L=0;r.target=0;r.mode='print';r.root.visible=true;};
  const tear=r=>{r.mode='fall';r.life=0;g.attach(r.root);const K=g.userData.fxK||1;r.v.set(0,0.1*K,-0.5*K);};
  let last=null,si=0,ri=0,cur=null;const T=new THREE.Vector3(),D=new THREE.Vector3(),X=new THREE.Vector3(1,0,0),Z=new THREE.Vector3(0,0,1);
  g.userData.receipts=rec;
  g.userData.anim=t=>{const dt=last===null?0:Math.min(0.05,Math.max(0,t-last));last=t;const K=g.userData.fxK||1,F=ctrl;
    const rc=Math.pow(1-Math.min(1,F.since/0.25),2)*P.kick;body.rotation.z=rc;body.position.x=-rc*0.7;
    flash(F,t);
    if(F.fired){body.updateMatrix();const rounds=P.rounds||1;
      for(let r=0;r<rounds;r++){if(!BF.v)continue;const n=BF.pellets||1,sp=BF.spread||0.015,off=rounds>1?(r-0.5)*0.07:0;
        for(let j=0;j<n;j++){const q=shots[si++%shots.length];
          T.set(brl.position.x+MZ,brl.position.y,0).applyMatrix4(body.matrix);
          D.set(1,(Math.random()-0.5)*2*sp+off,(Math.random()-0.5)*2*sp).normalize().applyAxisAngle(Z,body.rotation.z);
          q.m.position.copy(T);q.m.quaternion.setFromUnitVectors(X,D);q.m.scale.set(BF.s[0],BF.s[1],BF.s[2]);
          q.v.copy(D).multiplyScalar(BF.v*K);q.life=10/BF.v;q.m.visible=true;}}
      const add=PRINT[sel.frame]*rounds;
      if(!cur||cur.target+add>2.0){if(cur)tear(cur);cur=rec[ri++%rec.length];reset(cur);}
      cur.target+=add;}
    if(cur){cur.L=Math.min(cur.target,cur.L+3.2*dt);if(cur.L>=cur.target-1e-4&&F.since>0.35){tear(cur);cur=null;}}
    shots.forEach(q=>{if(!q.m.visible)return;q.life-=dt;q.m.position.addScaledVector(q.v,dt);if(q.life<=0){q.m.visible=false;q.m.scale.setScalar(0.001);}});
    rec.forEach(r=>{if(r.mode==='off')return;
      if(r.mode==='fall'){r.life+=dt;r.v.y-=2.4*K*dt;r.v.multiplyScalar(Math.pow(0.4,dt));r.root.position.addScaledVector(r.v,dt);
        r.root.rotation.x+=Math.sin(t*5+r.seed)*dt*1.5;r.root.rotation.y+=dt*0.8;if(r.life>1.4){r.mode='off';r.root.visible=false;}}
      layout(r,t);});
  };
}

  add(fr,new THREE.Vector3(),new THREE.Vector3());
  add(withBrand(sel.chamber,()=>PF('chamber',sel.chamber)(true)),new THREE.Vector3(0,2.36,0),new THREE.Vector3(0,1.25,0));
  add(withBrand(sel.barrel,()=>PF('barrel',sel.barrel)(true)),new THREE.Vector3(1.4,2.0,0),new THREE.Vector3(1.3,0,0));
  add(withBrand(sel.ammo,()=>PF('ammo',sel.ammo)(true)),new THREE.Vector3(w.pos[0],w.pos[1],0),new THREE.Vector3(Math.sin(w.rz)*1.1,-Math.cos(w.rz)*1.1,0),w.rz);

  red:{seg:8,rad:[2.3,2.45],rot:Math.PI/8,top:(c,w,h)=>{R(c,700,0,0,w,h);circ(c,800,32,32,27);circ(c,900,32,32,21);},

  gld:{seg:4,rad:[2.5,2.65],rot:0,top:(c,w,h)=>{R(c,700,0,0,w,h);poly(c,800,[[32,3],[61,32],[32,61],[3,32]]);poly(c,600,[[32,14],[50,32],[32,50],[14,32]]);poly(c,900,[[32,18],[46,32],[32,46],[18,32]]);},
    floor:(c,w,h)=>{R(c,950,0,0,w,h);for(let k=-32;k<64;k+=16)poly(c,900,[[k,32],[k+6,32],[k+38,0],[k+32,0]]);}},
  grn:{seg:4,rad:[2.97,3.05],rot:Math.PI/4,top:(c,w,h)=>{R(c,800,0,0,w,h);R(c,900,8,8,24,24);R(c,700,32,32,24,24);R(c,950,32,8,24,24);R(c,950,8,32,24,24);},
    floor:(c,w,h)=>{R(c,950,0,0,w,h);R(c,900,0,0,16,16);R(c,900,16,16,16,16);R(c,800,0,0,w,1);R(c,800,0,0,1,h);}},
  blu:{seg:12,rad:[2.2,2.3],rot:0,top:(c,w,h)=>{R(c,900,0,0,w,h);c.strokeStyle=B.pal[700];c.lineWidth=3;c.beginPath();c.arc(32,32,24,0,Math.PI*2);c.stroke();R(c,500,31,5,3,6);},
    floor:(c,w,h)=>{R(c,950,0,0,w,h);R(c,900,0,0,10,h);R(c,800,16,0,3,h);}}
};
function pedestal(){const s=STAGE[B.key];
  const side=C('pedSide',128,16,(c,w,h)=>{R(c,800,0,0,w,h);R(c,B.key==='blu'?500:700,0,0,w,3);R(c,950,0,h-2,w,2);for(let x=0;x<w;x+=16)R(c,950,x,0,2,h);});
  const geo=new THREE.CylinderGeometry(s.rad[0],s.rad[1],0.36,s.seg);geo.rotateY(s.rot);
  const m=new THREE.Mesh(geo,[side,C('pedTop',64,64,s.top),solid(950)]);m.position.y=-0.18;return m;}

const scene=new THREE.Scene();scene.background=new THREE.Color(B.pal[950]);
const camera=new THREE.PerspectiveCamera(42,4/3,0.1,90);
const lightW=new THREE.Vector3(-0.55,0.75,0.65).normalize();
function triCount(o){let n=0;o.traverse(m=>{if(m.isMesh&&!m.userData.fx){const gm=m.geometry;n+=(gm.index?gm.index.count:gm.attributes.position.count)/3;}});return Math.round(n);}
function collect(o){const a=[];o.traverse(m=>{if(m.userData.anim)a.push(m.userData.anim);});return a;}
function fit(obj,size){const holder=new THREE.Group();holder.add(obj);
  const bb=new THREE.Box3().setFromObject(obj),c=bb.getCenter(new THREE.Vector3()),s=bb.getSize(new THREE.Vector3());
  obj.position.sub(c);holder.scale.setScalar(size/Math.max(s.x,s.y,s.z));
  const posts=[];obj.traverse(m=>{if(m.userData.post){posts.push(m.userData.post);delete m.userData.post;}});posts.forEach(p=>p());return holder;}
const SIZES={assembled:4.7,frame:3.9,chamber:2.8,barrel:4.0,ammo:2.6,tags:2.6};
function makeItem(obj,k,parent){const root=new THREE.Group(),spin=new THREE.Group();spin.position.y=1.75;spin.rotation.y=0.55;
  spin.add(fit(obj,SIZES[k]));root.add(spin);root.add(pedestal());parent.add(root);
  return {root,spin,obj,tris:triCount(obj),anims:collect(obj)};}

const worlds={};
function build(){
  BRANDS.forEach(bk=>{B=BR[bk];
    const w={group:new THREE.Group(),items:{}};scene.add(w.group);
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(90,90,36,36),M(T(32,32,STAGE[bk].floor),[45,45]));fl.rotation.x=-Math.PI/2;fl.position.y=-0.36;w.group.add(fl);
    SLOTS.forEach(k=>{w.items[k]=makeItem(VAR[k][0][bk](true),k,w.group);for(let v=1;v<4;v++)w.items[k+'@'+v]=makeItem(VAR[k][v][bk](true),k,w.group);});
    w.items.tags=makeItem(buildTags(),'tags',w.group);
    worlds[bk]=w;});
  B=BR.gld;rebuildGun();apply();
}
let gun=null;
function rebuildGun(){
  if(!worlds[sel.frame])return;
  if(gun){gun.root.parent.remove(gun.root);}
  const host=worlds[sel.frame].group;
  gun=withBrand(sel.frame,()=>makeItem(buildGun(sel),'assembled',host));
  gun.obj.traverse(m=>{if(m.userData.socket)m.visible=false;});gun.ctrl=gun.obj.userData.ctrl;
  gun.spin.rotation.y=gunSpin;
}

/* ---------- state + UI ---------- */
const $=id=>document.getElementById(id);
let brand='gld',cur='assembled',lineup=false,exploded=false,shooting=false,declined=false,shownShots=-1,ex=0,hi=false,gunSpin=0.55;
let sel={frame:'gld',chamber:'gld',barrel:'gld',ammo:'gld'};
let spinOn=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let theta=0,phi=0.14,dragging=false,lx=0,ly=0;
function setPressed(el,v){el.setAttribute('aria-pressed',v?'true':'false');}
const isMixed=()=>SLOTS.some(s=>sel[s]!==sel.frame);
function renderBrands(){const el=$('brands');BRANDS.forEach(bk=>{const b=BR[bk],btn=document.createElement('button');btn.className='brand';btn.dataset.b=bk;
  btn.style.setProperty('--s',b.pal[500]);btn.style.setProperty('--bg',b.pal[900]);btn.style.setProperty('--bd',b.pal[700]);
  btn.innerHTML=b.name+'<small>'+b.corp+' · '+P[bk].frame.name+'</small>';
  btn.onclick=()=>{brand=bk;sel={frame:bk,chamber:bk,barrel:bk,ammo:bk};rebuildGun();apply();};el.appendChild(btn);});}
function renderTabs(){const t=$('tabs');ORDER.forEach(k=>{const b=document.createElement('button');b.className='tab';b.dataset.p=k;b.textContent=k.toUpperCase();
  b.onclick=()=>{cur=k;if(lineup&&k==='assembled')lineup=false;apply();};t.appendChild(b);});}
function renderBuild(){const el=$('build');el.innerHTML='<div class="head"><span>Build · any part from any brand</span><span id="b-state"></span></div>';
  SLOTS.forEach(s=>{const l=document.createElement('span');l.className='label';l.textContent=s;el.appendChild(l);
    BRANDS.forEach(bk=>{const b=BR[bk],c=document.createElement('button');c.className='chip';c.dataset.slot=s;c.dataset.b=bk;
      c.style.setProperty('--s',b.pal[500]);c.style.setProperty('--bg',b.pal[900]);c.style.setProperty('--bd',b.pal[700]);c.textContent=b.name;
      c.setAttribute('aria-label',s+': '+b.name+' '+P[bk][s].name);
      c.onclick=()=>{sel[s]=bk;if(s==='frame')brand=bk;rebuildGun();apply();};el.appendChild(c);});});}
function renderModels(){const el=$('models');el.innerHTML='<div class="head"><span>Model · current or an alternate after a real gun</span><span id="m-state"></span></div>';
  SLOTS.concat(['all']).forEach(s=>{const l=document.createElement('span');l.className='label';l.textContent=s;el.appendChild(l);
    for(let v=0;v<4;v++){const c=document.createElement('button');c.className='chip';c.dataset.slot=s;c.dataset.v=v;
      c.onclick=()=>{(s==='all'?SLOTS:[s]).forEach(k=>{vr[k]=v;});rebuildGun();apply();};el.appendChild(c);}});}
function updateModels(){const bkOf=s=>cur==='assembled'&&!lineup?sel[s]:brand;
  document.querySelectorAll('#models .chip').forEach(c=>{const s=c.dataset.slot,v=+c.dataset.v,bk=s==='all'?brand:bkOf(s),b=BR[bk];
    c.style.setProperty('--s',b.pal[500]);c.style.setProperty('--bg',b.pal[900]);c.style.setProperty('--bd',b.pal[700]);
    const nm=s==='all'?(v?'ALL ALT '+v:'ALL CURRENT'):nameOf(s,bk,v);c.innerHTML=nm+'<small>'+(s==='all'?'every part':(v?(AP(s,bk,v).ref):'current'))+'</small>';
    c.setAttribute('aria-label',s+': '+nm);setPressed(c,s==='all'?SLOTS.every(k=>vr[k]===v):vr[s]===v);});
  if($('m-state'))$('m-state').textContent=SLOTS.filter(k=>vr[k]).length+' of 4 alternate';}
function fitName(){const h=$('s-name'),max=96;h.style.fontSize=max+'px';const avail=h.parentElement.clientWidth-48;let s=max;while(h.scrollWidth>avail&&s>36){s-=4;h.style.fontSize=s+'px';}}
function sheet(){
  if(cur==='assembled'){
    const f=P[sel.frame].frame,shot=3+CH_TAGS[sel.chamber]+BA_TAGS[sel.barrel],extra=[];
    if(sel.frame==='red')extra.push('2 projectiles per pull');if(sel.frame==='blu')extra.push('×5 tag charges at full charge');
    if(sel.chamber==='blu')extra.push('+2 durability');if(sel.barrel==='red')extra.push('split into pellets');
    const rows=SLOTS.map(s=>[s+(vr[s]?' · '+VN[vr[s]]:''),BR[sel[s]].name+' '+partName(s,sel[s])+'. '+P[sel[s]][s].fn+'.'+(vr[s]?' After the '+AP(s,sel[s]).ref+'.':'')]);
    rows.push(['Shoot',(vr.frame?AP('frame',sel.frame).fire:FIRE_TXT[sel.frame])+' '+(vr.chamber?AP('chamber',sel.chamber).fire:CH_FIRE[sel.chamber])+' Each round prints a receipt from the left side of the chamber, toward the shooter. The light flashes green when the transaction clears and red when it is declined, and a declined round never fires.']);
    rows.push(['Per shot','Up to '+shot+' tags: 3 ammo + '+CH_TAGS[sel.chamber]+' chamber + '+BA_TAGS[sel.barrel]+' barrel'+(extra.length?'. '+extra.join(', ')+'.':'.')]);
    const af=vr.frame?AP('frame',sel.frame):null,na=SLOTS.filter(s=>vr[s]).length;
    return {lot:(isMixed()?'CUSTOM BUILD // '+SLOTS.map(s=>BR[sel[s]].name).join(' · '):BR[sel.frame].name+' // FULL BUILD')+(na?' // '+na+' ALT':''),name:af?af.name:f.name,tag:af?af.tag:f.tag,rows,
      mount:isMixed()?'<b>Mixed build.</b> Every part keeps its own brand\'s palette, one brand per part. Tag brands check their stance against the ammo brand using the day\'s relationship web.':'<b>All four parts sit on universal mounts.</b> Pick a different brand for any slot below and the rest of the build stays put. Turn on Exploded to see the sockets.'};}
  const d=P[brand][cur],code={frame:'F',chamber:'C',barrel:'B',ammo:'A',tags:'T'}[cur];
  if(cur!=='tags'&&vr[cur]){const a=AP(cur,brand);return {lot:BR[brand].name+' // '+code+'-0'+(vr[cur]+1)+' '+cur.toUpperCase()+' // '+VN[vr[cur]].toUpperCase(),name:a.name,tag:a.tag,
    rows:d.rows.filter(r=>r[0]!==SHAPE_ROW).concat([['Based on',a.ref],[SHAPE_ROW,a.shape],['Current',d.name+'. Pick Current in the Model panel to compare.']]),mount:MOUNT[cur]};}
  return {lot:BR[brand].name+' // '+code+'-01 '+cur.toUpperCase(),name:d.name,tag:d.tag,rows:cur==='tags'?d.rows.concat(TAG_ROWS):d.rows,mount:MOUNT[cur]};
}
function apply(){
  if(!gun)return;
  if(cur!=='assembled'||lineup)shooting=false;
  const b=BR[brand],w=worlds[brand],root=document.documentElement.style;
  [950,900,800,700,600,500,400,300,200,100].forEach(n=>root.setProperty('--b'+n,b.pal[n]));
  root.setProperty('--shade',b.shadow||b.pal[700]);
  Object.entries(b.css).forEach(([n,v])=>root.setProperty('--'+n,v));
  $('logo').src=LOGO[brand];$('logo').alt=b.name+' logo';
  document.querySelectorAll('.brand').forEach(x=>setPressed(x,x.dataset.b===brand));
  document.querySelectorAll('.tab').forEach(x=>setPressed(x,x.dataset.p===cur));
  document.querySelectorAll('.chip').forEach(x=>setPressed(x,sel[x.dataset.slot]===x.dataset.b));
  $('build').hidden=cur!=='assembled'||lineup;
  if($('b-state'))$('b-state').textContent=isMixed()?'Custom':'All '+BR[sel.frame].name;
  BRANDS.forEach(bk=>{worlds[bk].group.visible=bk===brand;});
  scene.background.set(b.pal[950]);U.uFogColor.value.set(b.pal[950]);
  Object.values(w.items).forEach(it=>{it.root.visible=false;});PARTS.forEach((k,i)=>{const it=w.items[IK(k)];it.root.visible=lineup||k===cur;it.root.position.x=lineup?(i-2)*5.4:0;});
  gun.root.visible=!lineup&&cur==='assembled';
  const d=sheet();$('s-lot').textContent=d.lot;$('s-name').textContent=d.name;$('s-tag').textContent=d.tag;
  $('s-dl').innerHTML=d.rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');$('s-mount').innerHTML=d.mount;
  const tris=cur==='assembled'?gun.tris:w.items[IK(cur)].tris,lt=PARTS.reduce((s,k)=>s+w.items[IK(k)].tris,0),tt=lineup?lt:tris;
  $('hud-name').textContent=(cur==='assembled'&&!lineup&&isMixed()?'CUSTOM':b.name)+' // '+(lineup?'ALL PARTS':(cur==='assembled'?(exploded?'EXPLODED':(shooting?'FIRING':'ASSEMBLED')):cur.toUpperCase()+(vr[cur]?' · '+VN[vr[cur]].toUpperCase():'')));$('hud-name').dataset.base=$('hud-name').textContent;shownShots=-1;
  $('hud-tris').textContent='TRIS '+tt;
  const W=hi?640:320,H=hi?480:240;$('hud-res').textContent=W+'×'+H+' // 15-BIT';
  $('s-specs').innerHTML=b.note+'<br>Model <span>'+tt+' tris</span> · textures <span>≤128px</span>, nearest filter, no mipmaps<br>'+
    'Vertex snap <span>'+(U.uSnap.value?'on':'off')+'</span> · affine UVs <span>'+(U.uAffine.value?'on':'off')+'</span> · Bayer dither <span>'+(U.uDither.value?'on':'off')+'</span>'+
    (b.jitter?' · vertex drift <span>always on</span>':'')+(b.shadow?' · shadow tint <span>Purple-700</span>':'');
  setPressed($('t-line'),lineup);setPressed($('t-spin'),spinOn);setPressed($('t-exp'),exploded);setPressed($('t-shoot'),shooting);setPressed($('t-dec'),declined);$('t-exp').disabled=cur!=='assembled'||lineup;
  updateModels();setPressed($('t-res'),!hi);$('t-res').textContent=hi?'480p':'240p';
  setPressed($('t-wob'),!!U.uSnap.value);setPressed($('t-aff'),!!U.uAffine.value);setPressed($('t-dit'),!!U.uDither.value);
  renderer.setSize(W,H,false);U.uRes.value.set(W,H);U.uFogNear.value=lineup?22:10;U.uFogFar.value=lineup?55:26;
  fitName();
}
$('t-spin').onclick=()=>{spinOn=!spinOn;apply();};
$('t-exp').onclick=()=>{exploded=!exploded;if(exploded)shooting=false;apply();};
$('t-dec').onclick=()=>{declined=!declined;if(declined&&!shooting){shooting=true;exploded=false;lineup=false;cur='assembled';}apply();};
$('t-shoot').onclick=()=>{shooting=!shooting;if(shooting){exploded=false;lineup=false;cur='assembled';}apply();};
$('t-line').onclick=()=>{lineup=!lineup;if(lineup&&cur==='assembled')cur='frame';apply();};
$('t-res').onclick=()=>{hi=!hi;apply();};

$('t-wob').onclick=()=>{U.uSnap.value=U.uSnap.value?0:1;apply();};
$('t-aff').onclick=()=>{U.uAffine.value=U.uAffine.value?0:1;apply();};
$('t-dit').onclick=()=>{U.uDither.value=U.uDither.value?0:1;apply();};
window.addEventListener('resize',fitName);
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lx)*0.008;phi=Math.max(-0.08,Math.min(0.85,phi+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
const end=()=>{dragging=false;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

let last=performance.now(),clock=0;
function frame(now){
  if(!gun){requestAnimationFrame(frame);return;}
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;U.uTime.value=clock;
  const target=exploded&&cur==='assembled'?1:0;ex+=(target-ex)*Math.min(1,dt*6);
  gun.obj.userData.parts.forEach(p=>p.h.position.copy(p.base).addScaledVector(p.ex,ex));
  if(gun.root.visible)gun.obj.traverse(m=>{if(m.userData.socket)m.visible=ex>0.08;});
  const w=worlds[brand],vis=[gun].concat(PARTS.map(k=>w.items[IK(k)])).filter(it=>it.root.visible);
  gun.ctrl.on=shooting&&gun.root.visible;gun.ctrl.declined=declined;stepCtrl(gun.ctrl,dt);
  if(shooting&&gun.ctrl.attempts!==shownShots){shownShots=gun.ctrl.attempts;$('hud-name').textContent=$('hud-name').dataset.base+' · '+gun.ctrl.shots+' RDS'+(declined?' · DECLINED':'');}
  vis.forEach(it=>{it.anims.forEach(a=>a(clock,it.ctrl||IDLE));if(spinOn&&!dragging)it.spin.rotation.y+=dt*0.5;});
  gunSpin=gun.spin.rotation.y;
  const r=lineup?24:8.6,ty=lineup?1.4:1.75;
  camera.position.set(Math.sin(theta)*Math.cos(phi)*r,ty+Math.sin(phi)*r,Math.cos(theta)*Math.cos(phi)*r);
  camera.lookAt(0,ty,0);camera.updateMatrixWorld();
  U.uLight.value.copy(lightW).transformDirection(camera.matrixWorldInverse);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
renderBrands();renderTabs();renderBuild();renderModels();
const faces=['900 48px "Barlow Condensed"','800 12px "Barlow Condensed"','400 40px "Bebas Neue"','italic 700 20px "Cormorant Garamond"',
  '500 16px "DM Sans"','700 16px "DM Sans"','500 16px "DM Mono"','400 12px "Space Mono"'];
Promise.race([Promise.all(faces.map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>{build();requestAnimationFrame(frame);});
})();
</script>
