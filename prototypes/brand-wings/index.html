/* ================= BLOOD (branch floor-mosaics, 2026-11-25) =================
   Enemies bleed their brand's contrast colour (accent): GLD purple, RED coolant cyan, BLU arc orange, GRN bloom magenta.
   Every hit throws small speckles along the shot; a death leaves a large splotch plus a ring of drops. Drops fly as
   particles, then stamp into 320 px stain canvases made lazily where fights happen, so stains last the whole run for
   one drawImage per visible stain chunk. Landed blood is darkened 20% (pool cores 40%) so fresh drops read brighter
   than old stains. Cosmetic randomness uses Math.random, never G.rng, so the day seed stays deterministic.

 D.snap={hp:p.hp/p.max,cash:p.cash,kpm,time:G.t-D.t0,delta:seg&&!seg.cleared?CFG.segExpected-tIn:0,burn};
 if(D.state==='Dormant')return;
 let tier=D.tier;const S=D.snap;

 D.w.Kill=Math.round(clamp(50+lean.Kill+60*(S.hp-.5)+(kpm>=10?10:0)-(S.hp<.3?40:0),0,100));
 D.w.Drain=Math.round(clamp(35+lean.Drain+(p.cash>200?20:0)+(burn<.6?15:0)+(S.hp<.3?25:0),0,100));
 const ap=D.w.Kill>=D.w.Drain?'Kill':'Drain';if(ap!==D.ap){D.ap=ap;dlog('Approach -> '+ap+' (Kill '+D.w.Kill+' / Drain '+D.w.Drain+')')}

 const roll=()=>{let r=G.rng();for(const m of mix){if(r<m[1])return m[0];r-=m[1]}return mix[0][0]};
 if(seg&&!seg.cleared&&!(ap==='Kill'&&S.hp<.3)){
  const alive=G.en.filter(e=>!e.dead&&!e.boss&&!e.scripted&&e.type!=='fodder'&&e.type!=='target').length,cap=ES(3+tier);

 if(wb)for(let k=rk+1;k<=3;k++){const s=G.seg[RIDX[wb+k]];if(!s||s.entered)continue;
  if(s.mods.length<ES(2)){const type=ap==='Kill'?(G.rng()<.5?'ranged':'buffer'):'tank',cost=CFG['cost_'+type];if(D.budget-cost>=reserve+10){D.budget-=cost;D.spent+=cost;s.mods.push(type);dlog('ModifySegment('+wb+' '+k+', '+ap+'): +'+NAME[type])}}break}
}

 for(const k of SEG_ROOMS){const s=G.seg[k];if(!s.entered||s.cleared)continue;const left=G.en.filter(e=>!e.dead&&e.scripted&&e.seg===k).length,r=ROOMS[k],nw=segWaves(k).length;

 const priceBody=`<table class="web">${price}</table><p style="margin:6px 0 0;opacity:.75">Opening prices at baseline Worth. Everything moves with the live market: a round is one share (Worth x $${CFG.pricePerWorth}${CFG.ammoMarkup!==1?' x '+CFG.ammoMarkup:''}), heals bill your provider's Worth per HP (+/-15% by stance), abilities bill the selected card at the ability brand's Worth x $${CFG.abilityK}. Every wing's room 3 has its brand's three machines (ammo, health, buff). Market events: ${BR.map(b=>chip(b)+' '+EV[b]).join(' &nbsp; ')}; triggers are not disclosed, follow the brand-colored signals in the store.</p>`;
 const notesBody=`<div class="mpn"><b class="hd">New in this pass: hub and brand wings</b><ul>
<li>You still start in the Entrance. Its north door opens into the HUB, and four brand wings hang off the hub: ${chip('BLU')} west, ${chip('RED')} east, ${chip('GLD')} and ${chip('GRN')} north. Take them in any order.</li>
<li>Every wing runs the same way: room 1 opens room 2 when cleared, room 2 ends at the wing's pay gate (pay, or wait out the PayWindow), room 3 holds the brand's three machines and a checkpoint and opens the arena when cleared, and room 4 is that brand's BOXY BROS franchise. The arena door locks behind you until the bosses are down.</li>
<li>Room enemies take the wing's brand (Director spawns 70%, Temps 75%). The Director keeps one budget across the store and only spends in the wing you are in; RED leans Kill, BLU leans Drain.</li>
<li>${chip('RED')} Loading Dock, Conveyor Lanes (belts push you sideways), Foundry Aisle (narrow corridor with flanker bays), Crucible (pit and pillars).</li>
<li>${chip('GLD')} Atrium (stepped diamond, relic on the altar), Procession (pews either side of a runway), Tithe Hall (V-pockets), Sanctum (octagon round a dais).</li>
<li>${chip('GRN')} Produce Market, Greenhouse Stacks (two cubes swap on a timer), Fulfillment Maze (loops round a central kiosk; the audit courier runs to its terminal), Canopy (rings of cubes).</li>
<li>${chip('BLU')} Lobby (relic on the mezzanine), Server Hall (racks you can zap or hop through), Beta Floor (panels swap every ${CFG.panelEvery}s and flash first), Keynote Stage.</li>
<li>Leave by the Street door on the Entrance's left wall. With all four arenas cleared that's the Settlement; leaving earlier ends the run and forfeits the loot bag.</li></ul>
<b class="hd">Previous pass: the wallet</b><ul><li>Tickers show each brand's round price as the big number (no Worth %), and the one-minute change in dollars.</li><li>Your cards sit in a wallet that slides in from the right edge; each one peeks out showing owed, power and its bar.</li><li>The card you're using is inserted in the reader above your cash, at full size. Switching (1-4) pops the new card out of the wallet, drops the old one out of the reader and back into its pocket, and slots the new one in.</li><li>The gun can't fire during a swap (0.5 s, in Tune). A charge in progress is lost.</li><li>Putting the card in the WALLET to repay takes it out of the reader and leaves it popped up in the wallet.</li></ul>
<b class="hd">Ammo price strip</b><ul><li>Under your cash: the selected ammo and what one pull costs, with tag surcharges included (the small line splits ammo from tags, and shows the round count when a pull fires more than one). The rest of the gun readout (stances, parts, combo, bag, ability timers) is in the debug view.</li></ul>
<b class="hd">Vertical layout</b><ul><li>The gun view is gone from the bottom HUD. The panel now holds only the card in its reader, your cash and the ammo price per pull.</li><li>The store now runs bottom to top: you start in the Entrance at the bottom and push upward through Seg 1, Seg 2, Seg 3 and the Arena at the top. Rooms, shelves, doors, spawns, checkpoints and the Seg 2 gate are the same, just rotated, so the FIRE brand space now sits on the right side of Seg 2. W moves you toward the next room. Each room's name is painted at its entry edge. There's extra floor below the Entrance so the bottom HUD doesn't cover the start, and the practice targets stand in a column along the Entrance's right wall.</li><li>The four brand stock tiles now sit in one row under the news ticker, which runs the full width of the screen. The room progress panel, DEBUG button and debug panels hang below that row.</li></ul>
<b class="hd">Debug panels</b><ul><li>Today's Market Events and the minimap are hidden by default and open with the AI Director under the DEBUG button (or T).</li></ul>
<b class="hd">News ticker</b><ul><li>Headlines and market news (Bull, Bear, Floor, Recovery, market events, prevented events) only appear in the top news bar now; they no longer pop up mid-screen. Each item scrolls across three times, then the next one plays. The latest item rests in the bar once the queue is empty. ROOM CLEAR still pops up, since it's not news. Scroll speed is in Tune.</li></ul>
<b class="hd">Ticker column</b><ul><li>The four brand tickers stack down the left edge. Each one shows its round price as the big number, a line chart of the last minute (dotted line = a minute ago, square = now), and the price change over that minute.</li></ul>
<b class="hd">Recoil</b><ul><li>Each pull shoves Ed back along his aim. The kick grows with what the pull cost (ammo Worth x rounds) and with the tag widths loaded, so the starter pistol barely moves him, while a fully tagged pull of expensive ammo pushes him back noticeably and loosens his steering while the shove lasts. Pump and charged shots kick harder.</li><li>Five recoil values are in Tune (kick, price growth, per-tag growth, settle rate, grip).</li></ul>
<b class="hd">$1,000 cards</b><ul><li>Every card's limit is $1,000.</li><li>Card power ramps faster: 100% at a quarter of the bar, 200% at 60%, 300% from 90% (in 25% steps, straight lines between). The three breakpoints are in Tune. Saved tuning for the old limit and curve was cleared once.</li></ul>
<b class="hd">Breakable products</b><ul>
 <li>Shots that reach a product chip its health (Small ${CFG.hpS}, Medium ${CFG.hpM}, Large ${CFG.hpL} HP). A health bar in the brand's colour appears once it's damaged; the number shown is in the colour of your ammo.</li>
 <li>At zero the product breaks and drops its value (size base x brand Worth) as cash on the floor: a green bill, not a rebate slip. Walking over it puts the cash straight into BANK; it doesn't pay down a card. Every other way of breaking a product (F, blasts, thrown bodies) now drops cash the same way.</li>
 <li>A product stops a normal shot, and the round's tags fire where it hit. Penetrate and beams pass through. Shooting a signal item breaks it and prevents its market event, same as smashing it.</li></ul>
<b class="hd">New in this pass: edits</b><ul><li><b>Starter loadout:</b> the gun is all GLD parts (Pistol, Cycle, Fast, Radiation) with no tags loaded and none in stock. Add tags from the Tag Bench catalog. Saved loadouts were reset once for this.</li><li><b>Shooting targets:</b> there is one per brand along the Lobby's back wall. They never move, attack or pay, and reset to full at 0 HP, so they're for testing damage and stances.</li><li><b>BLU no longer hides anything:</b> every brand stance and number is shown.</li><li><b>HUD moved:</b> HP and the gun are along the bottom-left corner. Cash, status and the card stack are bottom-right. The AI Director is a debug panel, off by default: press the DEBUG button or T to turn it on.</li><li><b>Credit doubled.</b> Every card starts at a $${CFG.cardLimit} limit and gains $${CFG.levelLimit} per level.</li><li><b>Dropshipper.</b> New enemy that throws delivery drones that chase you and blow up on contact. See the enemy table.</li><li><b>Card stack.</b> Cards sit stacked in the bottom left; the selected card is pulled to the front at full size.</li><li><b>Half the enemies.</b> Waves, Temp packs, the Temp cap, Director reinforcements and arena adds are all multiplied by ${CFG.enemyScale} (Tuning: Enemy count multiplier).</li></ul><b class="hd">Earlier: enemy reactions</b><ul>
 <li><b>Enemies react to being shot and shot at.</b> A hit, or a near-miss (a round passing through its whiz sphere without hitting it), rolls one reaction from a weighted table: archetype base weights plus a brand bias. One roll per enemy every ${CFG.reactCd} s. Misses still cost money, but near-misses now buy suppression.</li>
 <li><b>Hesitate</b> (three dots): slows to ${Math.round(CFG.hesSpd*100)}% for ${CFG.hesMin} to ${CFG.hesMax} s. Mostly Temps; anyone walking into a hesitating body is stuck in its traffic (dashed ring). Flankers push through. <b>Break Sightline</b> (dashed path): moves out of your view, to the side of your aim, then comes back from that angle; at most ${CFG.slCap} at once. <b>Push Forward</b> (chevrons): advances faster for ${CFG.pushDur} s. <b>Roll / dive</b>: the old flavor roll, now one entry in the table.</li>
 <li>${chip('RED')} <b>gets angrier</b> (confirmed): Adrenaline +40, Retaliate +25, Push +10, Sightline -20, Hesitate -30. <b>Adrenaline</b> (coolant ring): +${Math.round(CFG.adrMove*100)}% move and +${Math.round(CFG.adrAtk*100)}% attack rate per stack, up to ${CFG.adrMax}; every further hit adds a stack and refreshes the ${CFG.adrDur} s timer; at max it vents steam and ignores Hesitate. <b>Retaliate</b> (near-miss only, line and !): sprints at you at +${Math.round((CFG.retSpd-1)*100)}% for ${CFG.retDur} s and can't fire, then a ${CFG.retCd} s cooldown.</li>
 <li>Proposed biases: ${chip('GLD')} pushes forward and drags nearby Temps with it. ${chip('BLU')} has no bias and rolls everything its archetype can do flat. </li>
 <li>${chip('GRN')} <b>Scatter &amp; Flank</b> (confirmed 2026-11-23, replaces Task Force): Flank +40, Sightline +10, Hesitate -15, Push -25. Shot at, it hops ${CFG.fkScat} px sideways off your aim line (magenta ring), away from your aim point; GRN enemies reacting together alternate sides, so a group splits around you. Then it paths (magenta dashed line) to a spot 60 to 120 deg off your facing, preferring cover, and comes back at you from the side. No flank spot: falls back to Break Sightline. Counts toward the cap of ${CFG.slCap}; over the cap it only scatters. ${CFG.fkCd} s cooldown. Not available to Flankers or Couriers.</li>
 <li>Each reaction pops a pixel badge: HS, SL, PF, AD, RT, FL. The Director tilts the table: Kill adds weight to Adrenaline, Drain to Hesitate.</li>
 <li>To make brand patterns visible, store enemies now roll a primary brand from the seed (Tuning: Enemy brands, 0 puts everything back to GRN).</li></ul>
 <b class="hd">New in this pass: rebates</b><ul>
 <li><b>Enemies drop rebate slips, not cash.</b> A slip carries the enemy's brand. Its value is the old payout scaled by that brand's share price against its baseline, so a GLD enemy in Bull pays more than one in Bear.</li>
 <li><b>Picking one up pays down the card you're holding</b> (the selected card); anything past its balance goes to BANK cash. Combo multiplier, Director pay and Prosperity Gospel still apply. The Positive-stance 25% round refund now rides on the rebate instead of paying instantly.</li>
 <li>Tuning has a processing delay (default 0, instant). Set it to 6 to 8 s to try "allow time for processing", which keeps WALLET as the main way to repay; the slip then posts to whichever card you held when you picked it up.</li></ul>
 <b class="hd">Previous pass: room progress</b><ul>
 <li>A progress panel under the market tiles shows the room you're in, the wave, wave enemies down out of the total, a block bar, and a pip each for rooms 1-3 and the arena.</li>
 <li>Wave enemies (the ones that count toward clearing a room) wear white corner brackets. Everything else is Director reinforcement.</li>
 <li>Clearing a room flashes the panel, raises a ROOM CLEAR banner, and bursts the opening door. The Director then stops reinforcing that room and spends on the rooms ahead.</li></ul>
 <b class="hd">Pixel effects in the level</b><ul>
 <li>Enemies now show only damage numbers, in pixel digits coloured by the ammo (or tag) that dealt them. The other enemy callouts (SLAM, PLATE OFF, STUNNED, SPOTTED, chain labels) are pixel effects instead.</li>
 <li>The Tag Bench's pixel effects run in the store: muzzle flashes, hit sparks that bounce, wall dust, a distinct burst for every impact tag, status bursts (BURN embers, RADIATION motes, STUN bolts, DIVIDEND coins), kill bursts, Capacitor charge and release, and blast rings, all on a 2 px grid with stepped fades.</li></ul>
 <b class="hd">The Tag Bench and sequenced tags</b><ul>
 <li><b>Tag Bench.</b> OPEN TAG BENCH in the loadout: your slots run left to right in firing order, your stock fans out below, and the catalog lists all 25 tags by brand. Drag a tag (it lags and leans), drop it on a slot and the neighbours slide over, click to load or unload, drop on SCRAP to bin it. Placing a tag flashes its stance with your ammo. TEST FIRE plays one round into a dummy with the chain at real speed.</li>
 <li><b>Ed's rounds use the bench rules.</b> Spawn and flight tags resolve when the round is bought; impact tags queue at the hit and fire one after another, ${CFG.tagDelay}s apart. Wide tags take 2 or 3 slots, never the frame. Each tag has a fixed, thematic brand. Every loaded tag adds Worth x $${CFG.tagPriceK} x its width to the round (half on support).</li>
 <li><b>Status effects.</b> Each hit adds stacks equal to the tag slots that fired; ${CFG.statusAt} stacks trigger the ammo's status once per enemy (BURN, RADIATION, STUN, DIVIDEND). ${CFG.statusCd}s without a hit and the stacks are lost. Pips over each enemy show the count.</li>
 <li><b>Pixel art.</b> Rounds are pixel sprites whose trail carries their tags' colours in slot order; each impact tag pops a pixel badge at the hit; fragments, shards, blasts and arcs are drawn on the same 2 px grid.</li></ul>
 <b class="hd">Stronger card power</b><ul>
 <li>Card power still reads 25% at an empty bar and 100% at half, in 25% steps, but the top half now climbs to ${Math.round(CFG.powerMax*100)}% (spec said 200%) and bends upward, so the last stretch adds the most. Ability scaling per point of power is also higher. At a full bar every ability gets a MAX POWER extra: RED dash blasts the area it lands in, GLD sprint bulldozes bodies out of your way, GRN hop lands with a stunning slam, BLU zap discharges where you arrive.</li></ul>
 <b class="hd">Frame tag slot</b><ul>
 <li>Each frame now has one projectile tag slot, and ammo has none. The frame's tag resolves first, then chamber, then barrel. Saved loadouts move their first ammo tag onto the frame.</li></ul>
 <b class="hd">Ed\'s face is the health bar</b><ul>
 <li>Doom style, bottom left: the less HP, the more damage shows. Past 80% a second crack opens; past 60% the smile chips and a chunk off the jaw shows the nervous system underneath; past 40% the visor glitches and the left jaw goes; under 20% the mask splits down the middle. The upper face is a blank RUINER-style LED visor; there are no eyes or smile, so the damage carries it. The portrait flashes red when you are hit and pulses dark red in Sudden Death.</li>
 <li>Next to it is the health insurance card: your provider\'s plan, HP, rate per HP after stance and perks, what you owe for the heal in progress, the Medical Bill if you go down, and whether your cash covers it (COVERED, UNDERINSURED, SUDDEN DEATH).</li></ul>
 <b class="hd">The Flanker, relationship notes and brand pricing</b><ul>
 <li>The relationship web now says what each stance does today, and a new table lists every brand's opening prices: round, heal per HP, card ability and vending machines.</li>
 <li>An arrowhead enemy that works round to your extreme flank out of sight, then peeks round a corner. An eye and a filling ring show it is watching. Aim at it (within ${CFG.flankCone}°) inside ${CFG.flankPeek} s and it ducks away to try the other side. Miss it and it flashes a dashed lane, then charges for ${CFG.flankDmg}, shoving through any crowd in its way, and is winded for ${CFG.flankRecover} s after. Scripted into SEG 2 and SEG 3, and the Director buys them in Kill mode.</li></ul>
 <b class="hd">Brand accent colours</b><ul>
 <li>Each brand now uses its tone-board base with one contrasting accent: GLD + Purple, RED + Coolant cyan, BLU + Arc orange, GRN + Bloom magenta. Accents sit only in shadow zones, deep borders and contrast details (hard shadows on swatches and cards, enemy drop shadows, the core of each round, plate edges, merch centre marks, the shadow under each gun part), never in place of the base. Text on brand colours is now ink. No mechanics, values or tuning changed.</li></ul>
 <b class="hd">Previous pass: decisions from the other design chats</b><ul>
 <li><b>BLU is Zap.</b> <kbd>TAB</kbd> blinks you toward where you are moving (or aiming), ${CFG.zapBase} px plus ${CFG.zapPer} px per 100% BLU power. It passes shelves and bodies, not walls or closed doors, and the landing jitters, because BLU. Billed to the selected card at BLU Worth x $${CFG.abilityK}.</li>
 <li><b>Default HUD.</b> Damage numbers, enemy health bars and the map are always on; the BLU HUD ladder is gone.</li>
 <li><b>Valued Customer zone.</b> The last ${Math.round(CFG.vcZone*100)}% of each card's bar fills at half speed, so a $${CFG.cardLimit} card really caps at $${(CFG.cardLimit*(1-CFG.vcZone+CFG.vcZone/CFG.vcRate)).toFixed(2)} owed. Power follows the bar: 25% when empty, 100% at a quarter full, 200% at 60%, 300% from 90%. The bar gets stripier and hotter as it fills, the card light pulses amber, and OWED lights up once the two numbers split. WALLET difficulty follows the bar; APR and repayments follow what you owe.</li>
 <li><b>Gun module.</b> Bottom left: your equipped frame, chamber, barrel and ammo as 2D sprites. The GLD drum turns, the RED pump racks, the GRN feed ticks, the BLU bow draws. Each barrel brand has its own muzzle flash, the card sits in its slot with the green or red transaction light, and a receipt prints off the chamber for every pull.</li>
 <li><b>Market events are explicit.</b> A panel on the right tracks today's four events (pending, fired, prevented), and every event, Bull, Bear, Floor and Recovery shows a banner that says what it does to your rounds, heals and abilities.</li>
 <li><b>Enemies roll and dive.</b> A hit enemy sometimes rolls sideways (Ranged dives and gets up). Pure flavor: the shot already landed for full damage and nothing is charged or refunded. Each brand moves differently; BLU blinks.</li>
 <li><b>Ed</b> wears the REDEEMER INTERFACE with two digital eyes, over the cracked default smile.</li></ul>
 <details><summary>Earlier passes</summary><b class="hd">Physicality (My Friend Pedro)</b><ul>
 <li><b>You feel what you paid for.</b> Every round shoves the enemy it hits, harder the more the round cost. Ammo brand changes how they move: RED blasts nearby bodies too, GRN hits stagger and drag, GLD sends them spinning on a curve, BLU knocks them the wrong way or blinks them.</li>
 <li><b>Plates.</b> Enemies wear branded plates (ring segments) that block ${Math.round(CFG.plateArmor*100)}% of damage. Break one and it flies off, bounces and lands as loot: <kbd>E</kbd> to grab and pocket, <kbd>F</kbd> to throw or smash it. A stripped enemy is lighter, and its bare core takes ${CFG.coreMult}x damage.</li>
 <li><b>Bodies have weight.</b> Fast bodies SLAM into walls and shelves for damage, PILE UP into other enemies, and smash any merch they slide through. Corpses keep their momentum; <kbd>F</kbd> punches a corpse across the floor, into a crowd or a shelf.</li>
 <li><b>Shelves are heavy physics objects.</b> Slams, pileups, flung corpses and flying plates nudge them a few pixels (a dashed outline shows where they started), they rattle on impact, and a hard enough hit knocks an item off the shelf for cash. <kbd>F</kbd> on a shelf gives it a shove. They drift at most ${CFG.shelfMax}px, so the layout holds.</li>
 <li><b>Feel.</b> Heavy hits add hitstop and screen shake. All of it is tunable under Physicality.</li></ul>
 <b class="hd">Earlier: matched to the 3D Gameplay Slice</b><ul>
 <li><b>Gun parts.</b> Frame, chamber, barrel and ammo are interchangeable across the four brands, with the eight tags in their slots. Build the gun under Loadout below.</li>
 <li><b>WALLET.</b> <kbd>R</kbd> jams the selected card into the handheld and starts that brand's game: RED Shift Crossing, GLD Ascension Run, GRN Fulfillment, BLU Signal Defense. <kbd>RMB</kbd> is its one button, <kbd>LMB</kbd> still fires, and repayments now come out of BANK cash.</li>
 <li><b>GRN card.</b> A fourth card, so the GRN game is reachable. Its jump is a short hop on <kbd>C</kbd> that clears shelves.</li></ul></details></div><details><summary>Enemy placeholders</summary><table><tr><th>Unit</th><th>Shape</th><th>Behaviour</th><th>HP</th><th>Cost</th><th>Pays</th></tr>

 <details><summary>Assumptions and stubs in this build</summary><ul>
 <li><b>Physicality:</b> a top-down stand-in for ragdoll. Knockback = ${CFG.kbK} x round price^0.75 px/s, divided by mass (Temp 0.5, Rusher 1, Tank 3.5, BIG BOX 7), and lost plates shrink mass toward 60%. Above ${CFG.tumbleSpd} px/s an enemy tumbles and can't move or attack, so Full-Auto can pin light enemies in place. That is a balance question to watch. Plate counts, armor, slam and pileup values are invented. Plates are worth Worth x $${CFG.plateValue} and count as merchandise. Bullets pass over corpses; only punches and blasts move them.</li>
 <li><b>Survivors pass:</b> only charges that land on a card earn XP. Anything that overflows to BANK, and APR, earns nothing.</li>
 <li><b>Survivors pass:</b> a higher limit lowers credit used %, so a card's ability power drops when it levels until you spend back up.</li>
 <li><b>Survivors pass:</b> perks apply to the whole run whichever card earned them. The levelling card's brand is weighted 3x in the draft. Every perk and its numbers are invented.</li>
 <li><b>Survivors pass:</b> reroll and banish fees are billed like abilities, so they also earn XP. Reroll price grows ${CFG.rerollGrow}x per use for the run.</li>
 <li><b>Survivors pass:</b> a Temp kill counts ${CFG.fodderCombo} toward combo and the market kill nudge, and is left out of the Director's kills/min, so a horde alone does not max the combo or trip Tier 3.</li>
 <li><b>Survivors pass:</b> kill rebates and the performance bonus are credited on pickup, not on the kill. Drops inside the pickup radius are pulled through shelves. Smash cash and the Positive-stance refund still pay instantly.</li>
 <li><b>Survivors pass:</b> BudgetReplenishRate is raised from 2 to 3 per second so bulk orders do not starve the Director's regular spawns.</li>
 <li><b>Reactions pass:</b> the archetype base weights, the whiz sphere (${CFG.whizR} px beyond the body), the GLD drag radius, GRN scatter distance, flank angles and cooldown, Push Forward speed and the Director tilt are invented. Bosses don't react. Break Sightline gives up after ${CFG.slMax} s if it can't reach cover. RED's Retaliate needs a near-miss, and Adrenaline needs a hit.</li>
 <li><b>Reactions pass:</b> brands are rolled per enemy for testing; the design's "Target buys hired brand units" would decide this in a real day. Same-brand ammo is still Neutral here, so RED on RED skips the relationship web until self-stances are built.</li>
 <li><b>Rebates pass:</b> rebate value = old payout x enemy brand Worth / baseline Worth, so pacing at baseline is unchanged. Paying down a card earns no XP. GRN Dividend, smash cash and plate loot still pay cash directly.</li>
 <li><b>This pass:</b> enemy outlines through shelves were part of the BLU HUD ladder and were not on your default list, so enemies you have no line of sight to stay hidden (and off the map).</li>
 <li><b>This pass:</b> Zap distances, its 0.5 to 4 s cooldown (1.5 s x 0.45 / BLU Worth) and the landing jitter are invented. A blocked Zap shows NO SIGNAL and costs nothing.</li>
 <li><b>This pass:</b> the zone rules are yours; the stripe and color treatment and the VALUED CUSTOMER popup are mine. A card declines a round only once it is at its real cap, and WALLET fees can push the balance into the zone too.</li>
 <li><b>This pass:</b> rolls are now one entry in the reaction table (at most once per ${CFG.dodgeGap} s each). Tanks, Temps and bosses never roll. A rolling enemy can't attack for that fraction of a second, which is the one way it touches combat.</li>
 <li><b>This pass:</b> the ~25% ammo raise you were considering is a tune value (Ammo price multiplier), left at 1.0.</li>
 <li><b>This pass:</b> the gun sprites are drawn in code from the sprite-sheet concepts, not the sheet itself, so proportions are approximate.</li>
 <li><b>Not in the 3D slice yet:</b> the tag slot sits on the frame (one) instead of the ammo (three), so this build carries up to two fewer tags than the 3D version.</li>
 <li><b>3D match:</b> frames, chambers, barrels, chamber and barrel tag slots, durability tiers (1 / 5 / 10 by ammo Worth below 0.3, below 0.7, above), tag resolution order and damage (Pistol 34, Charge 15 to 65 and 100 at full, everything else Worth x 40 split across pellets) are copied from the 3D slice. Barrel speeds use 49 px per metre.</li>
 <li><b>3D match, price:</b> a round now costs one share of the ammo brand, Worth x $${CFG.pricePerWorth}, as in the 3D slice (it was Worth x $1 here). To keep the same pacing I scaled two things with it: card level 2 now takes $${CFG.xpBase} of spend, and the per-round market nudge divides by ${CFG.roundDiv}. Kill payouts, Temp payouts and the $${CFG.startCash} BANK are unchanged, so money is much tighter than last pass.</li>
 <li><b>3D match:</b> rounds are still declined at the card's cap here (limit plus the Valued Customer stretch); the 3D slice overflows them to BANK. Ammo status effects (Radiation, Investment, Stun, Fire) are not built in either version.</li>
 <li><b>Top-down translations:</b> Penetrate passes through shelves, walls and enemies. Scattershot pellets bounce back from the hit point. Explosive also smashes merchandise in its blast for the normal smash value, but leaves event pickups alone. Rounds otherwise fly over merchandise. Burst's bonus charge resets after 2 s without firing, since there is no holster.</li>
 <li><b>WALLET:</b> the four games, their speeds, $${CFG.walletPay} per success and $${CFG.walletFee} per mistake are the 3D slice's. A repayment moves cash from BANK to the card, so with no cash it reads NO FUNDS. Difficulty follows credit used on the card in the WALLET. There is no sound in this slice, so GRN's metronome is visual only.</li>
 <li><b>GRN card:</b> the hop is my top-down stand-in for the jump: 0.3 s in the air plus 0.25 s per 100% power, clearing shelves and untouchable until you land. BLU is Zap as of this pass.</li>
 <li><b>Perks and parts:</b> RAPID ESCALATION multiplies the frame's rate, BUNDLE DEAL adds a billed round per pull at wider spread, PENETRATION PRICING gives one free pierce before any Penetrate tag is spent.</li>
 <li>Projectiles are discrete; price is frozen at spawn and Worth is read live at impact.</li>
 <li>Market nudges are scaled down and recovery is sped up: per-round price / 40000 (documented: / 100), kill nudge 0.0005 x Liquidity (documented: 0.01), rival loss 0.002 per kill (documented: 0.01), recovery drift x5. At the documented values the ammo brand reaches the 100% cap inside the first market tick of fighting and stays there. All four are in the tuning panel.</li>
 <li>Baseline momentum is 0 and event momentum decays 1 per tick (your open question on momentum equilibrium).</li>
 <li>Bull and Bear apply a flat Worth jump of 0.05 and set momentum to 2; Floor freezes the brand for 3 ticks, then Recovery adds 0.25.</li>
 <li>A nudge skips that brand's next sine and momentum step, but recovery drift still applies.</li>
 <li>BANK cash is $300, not the $1000 test value, so heal bills and APR can push you into Sudden Death. Any charge that takes cash negative triggers it.</li>
 <li>Card abilities bill the currently selected card at the ability brand's Worth x $10; each ability's power still follows its own card's credit used. At the selected card's limit the charge goes to BANK.</li>
 <li>Loans, debt collectors, Fence and Hoard are stubbed. At 0 HP you pay the Medical Bill and respawn at the checkpoint, or the run ends. Pocketed loot is valued at Settlement but not sold.</li>
 <li>BOXY BROS are treated as GRN-primary. Director runs Kill and Drain only; Trick and Taunt need traps and routing.</li>
 <li>Pay-to-pass upgrade: Kill gives enemies +15% damage, Drain cuts kill payouts 15%. Performance bonus is multiplied by 1 + LoanTotal / 100.</li></ul></details>

 <tr><td>Earned (rebates collected + smashing)</td><td>${$$(st.earn)}</td></tr><tr><td>&nbsp;&nbsp;of which smashing</td><td>${$$(st.smash$)}</td></tr>
 <tr><td>Rebates dropped / collected / expired</td><td>${$$(st.dropped$)} / ${$$(st.drop$)} / ${$$(st.lost$)}${floor$>0?' (+'+$$(floor$)+' left on floor)':''}</td></tr>
 <tr><td>Spent on ammo (${st.rounds} rounds, ${st.rounds?Math.round(st.hits/st.rounds*100):0}% hit)</td><td>${$$(st.ammo$)}</td></tr>
 <tr><td>Ammo cost per kill (${nk} kills)</td><td>${nk?$$(st.ammo$/nk):'—'}</td></tr>
 <tr><td>Rebates: paid down cards / to BANK cash</td><td>${$$(st.reb$card)} / ${$$(st.reb$cash)}</td></tr>
 <tr><td>Reactions (${st.whiz} from near-misses)</td><td style="font-size:11px">${Object.keys(st.react).filter(k=>k!=='none').map(k=>REACT_NAME[k]+' '+st.react[k]).join(', ')||'none'}</td></tr>
 <tr><td>Zaps / dodges seen / times in Valued Customer zone</td><td>${st.zaps} / ${st.dodges} / ${st.vcEnter}</td></tr>
 <tr><td>Flankers: spotted / charges / charges that hit you</td><td>${st.flankSpotted} / ${st.flankCharges} / ${st.flankHits}</td></tr>
 <tr><td>Draft fees (${st.rerolls} rerolls, ${st.banish} banishes)</td><td>${$$(st.reroll$+st.banish$)}</td></tr>
 <tr><td>WALLET: repaid from BANK / fees added</td><td>${$$(st.repaid$)} / ${$$(st.wfee$)}</td></tr>
 <tr><td>Heal + medical bills (${st.deaths} deaths)</td><td>${$$(st.heal$)}</td></tr><tr><td>APR</td><td>${$$(st.apr$)}</td></tr>
 <tr><td>Performance bonus (tracker x Director LoanTotal ${D.loan.toFixed(0)})</td><td>${win||left?$$(o.bonusFinal)+' to Savings':'forfeit'}</td></tr>
 <tr><td>Loot bag (${G.p.bag.length} items, valued not sold)</td><td>${$$(o.loot)}</td></tr></table>
 <h2>Cards and perks</h2><p style="margin:4px 0;line-height:1.7">${G.cards.map(c=>chip(c.b)+' LV '+c.lv+' · limit $'+c.limit+' · owes '+$$(c.bal)).join('<br>')}</p>
 <div style="max-height:150px;overflow:auto;border:3px solid var(--ink);padding:5px;font-size:11px;background:#fff;line-height:1.7">${picks}</div>
 <h2>Market events</h2><p style="margin:4px 0;line-height:1.7">${ev}</p>
 <h2>Final Worth</h2><p style="margin:4px 0">${BR.map(b=>chip(b)+' '+(G.mk[b].w*100).toFixed(0)+'% (base '+(BRAND[b].base*100).toFixed(0)+'%)').join(' &nbsp; ')}</p>
 </div><div><h2>Pace</h2><table><tr><th>Segment</th><th>Cleared in</th><th>Expected</th></tr>${segs}</table>
 <p style="margin:6px 0">Gun: ${PARTS.frame[G.gun.frame].name} frame, ${PARTS.chamber[G.gun.chamber].name} chamber, ${PARTS.barrel[G.gun.barrel].name} barrel, ${G.p.ammo} ammo.<br>Kills: ${kl}. Best combo: ${G.combo.best>=0?CTIER[G.combo.best]:'none'}. Damage taken: ${st.dmg.toFixed(0)}.<br>Director spent ${D.spent.toFixed(0)} budget and ordered ${D.temps} Temps, ended at Tier ${D.tier}, BossUpgradePool ${$$(D.pool)}.</p>
 <h2>Director log</h2><div style="max-height:230px;overflow:auto;border:3px solid var(--ink);padding:5px;font-size:11px;background:#fff">${D.log.map(l=>fmtT(l[0])+' '+l[1]).join('<br>')}</div></div></div>
 <p style="margin-top:14px"><button class="go" id="rs">Run again</button> <button id="bk">Back to morning paper</button></p>${tuneHTML()}</div>`;
 el('rs').onclick=()=>{newRun(opts);resume()};el('bk').onclick=showStart;bindTune()}
