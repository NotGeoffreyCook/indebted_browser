<style>
/* Layout: brand district console. Low-res viewport left, spec sheet right; stacks on phones. Single dark look per brand: the active brand's 950–100 scale is the whole world, swapped in by script. */
:root{
  --b950:#0D0100; --b900:#1A0300; --b800:#3D0700; --b700:#6B0D00; --b600:#A81800;
  --b500:#FF3B2F; --b400:#FF6B62; --b300:#FF9895; --b200:#FFC2BE; --b100:#FFE8E7;
  --white:#F0F0F0; --chalk:#B0B0B0;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --dweight:900; --dtrack:0;
  --tagfont:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --tagstyle:normal; --tagweight:800;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--b950);color:var(--white)}
body{font-family:var(--mono);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 36px;transition:background-color .2s}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--b700);padding-bottom:16px}
header img{width:56px;height:56px;image-rendering:pixelated;box-shadow:6px 6px 0 var(--b700);display:block}
h1{font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif;font-weight:900;font-size:clamp(36px,6vw,62px);line-height:.85;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{font-size:11px;letter-spacing:.18em;color:var(--chalk);text-transform:uppercase;margin-top:8px}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.brand{--s:#FF3B2F;--bg:#1A0300;--bd:#6B0D00;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--white);background:var(--bg);border:2px solid var(--bd);border-top:8px solid var(--bd);padding:10px 12px 9px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-weight:400;font-size:10px;color:var(--chalk);letter-spacing:.12em}
.brand:hover{border-color:var(--s)}
.brand[aria-pressed="true"]{border-top-color:var(--s)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.brands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:var(--dweight);font-size:22px;line-height:1;letter-spacing:.06em;color:var(--white);background:var(--b900);border:2px solid var(--b700);border-left:8px solid var(--b800);padding:8px 16px 6px 12px;cursor:pointer}
.tab:hover{border-color:var(--b400);border-left-color:var(--b400)}
.tab[aria-pressed="true"]{background:var(--b800);border-left-color:var(--b500)}
.tab:focus-visible,.tog:focus-visible,.brand:focus-visible{outline:2px solid var(--b300);outline-offset:2px}
.view{position:relative;border:6px solid var(--b700);background:var(--b950);aspect-ratio:4/3;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.view canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:grab}
.view canvas:active{cursor:grabbing}
.hud{position:absolute;font-size:11px;letter-spacing:.14em;color:var(--white);text-shadow:2px 2px 0 var(--b950);pointer-events:none;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud.tl{left:12px;top:10px}.hud.tr{right:12px;top:10px;color:var(--chalk)}
.hud.bl{left:12px;bottom:10px;color:var(--chalk)}.hud.br{right:12px;bottom:10px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--chalk);font-size:13px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.controls .label{font-size:11px;letter-spacing:.16em;color:var(--chalk);text-transform:uppercase;margin-right:4px}
.tog{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk);background:var(--b900);border:2px solid var(--b800);padding:7px 10px;cursor:pointer}
.tog:hover{border-color:var(--b400)}
.tog[aria-pressed="true"]{color:var(--white);border-color:var(--b600)}
.sheet{background:var(--b900);border:2px solid var(--b700);border-left:8px solid var(--b500);padding:20px 20px 22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lot{font-size:11px;letter-spacing:.18em;color:var(--b200);text-transform:uppercase}
.sheet h2{font-family:var(--display);font-weight:var(--dweight);letter-spacing:var(--dtrack);font-size:104px;line-height:.82;margin:0;color:var(--b100);text-shadow:7px 7px 0 var(--b950);white-space:nowrap}
.tagline{font-family:var(--tagfont);font-style:var(--tagstyle);font-weight:var(--tagweight);font-size:28px;line-height:1.05;color:var(--b200);text-wrap:balance}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;border-top:2px solid var(--b700);padding-top:14px}
dt{font-size:11px;letter-spacing:.14em;color:var(--b200);text-transform:uppercase;padding-top:2px}
dd{margin:0;font-size:13px;line-height:1.45;color:var(--b100)}
.warn{border:2px solid var(--b200);padding:10px 12px;font-size:12px;line-height:1.5;color:var(--b200)}
.warn b{color:var(--b100)}
.specs{font-size:11px;line-height:1.7;letter-spacing:.06em;color:var(--chalk);border-top:2px solid var(--b800);padding-top:12px;font-variant-numeric:tabular-nums}
.specs span{color:var(--white)}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>

let B=BR.red;
function snapPal(g,w,h){
  const d=g.getImageData(0,0,w,h),a=d.data,L=B.list;
  for(let i=0;i<a.length;i+=4){let best=0,bd=1e9;
    for(let k=0;k<L.length;k++){const p=L[k],r=a[i]-p[0],gg=a[i+1]-p[1],b=a[i+2]-p[2],dd=r*r+gg*gg+b*b;if(dd<bd){bd=dd;best=k;}}
    a[i]=L[best][0];a[i+1]=L[best][1];a[i+2]=L[best][2];a[i+3]=255;}
  g.putImageData(d,0,0);
}
function T(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);snapPal(g,w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const R=(g,c,x,y,w,h)=>{g.fillStyle=B.pal[c];g.fillRect(x,y,w,h);};
function border(g,w,h,t,c){t=t||3;c=c||B.edge;R(g,c,0,0,w,t);R(g,c,0,h-t,w,t);R(g,c,0,0,t,h);R(g,c,w-t,0,t,h);}

function text(g,s,x,y,size,c,o){o=o||{};const wt=o.weight||B.weight,al=o.align||'left',mw=o.maxW||999,f=o.font||B.font;let sz=size;

const BUILD={pain:buildPain,suffer:buildSuffer,hate:buildHate,success:buildSuccess,catharsis:buildCatharsis,satisfaction:buildSatisfaction,
  growth:buildGrowth,harvest:buildHarvest,provide:buildProvide,knowledge:buildKnowledge,assurance:buildAssurance,truth:buildTruth};

/* ---------- per-brand stage ---------- */
const STAGE={
  red:{seg:8,rad:[2.3,2.45],rot:Math.PI/8,top:(c,w,h)=>{R(c,700,0,0,w,h);circ(c,800,32,32,27);circ(c,900,32,32,21);},
    floor:(c,w,h)=>{R(c,900,0,0,w,h);R(c,800,0,0,w,2);R(c,800,0,0,2,h);}},
  gld:{seg:4,rad:[2.5,2.65],rot:0,top:(c,w,h)=>{R(c,700,0,0,w,h);poly(c,800,[[32,3],[61,32],[32,61],[3,32]]);poly(c,600,[[32,14],[50,32],[32,50],[14,32]]);poly(c,900,[[32,18],[46,32],[32,46],[18,32]]);},
    floor:(c,w,h)=>{R(c,950,0,0,w,h);for(let k=-32;k<64;k+=16)poly(c,900,[[k,32],[k+6,32],[k+38,0],[k+32,0]]);}},
  grn:{seg:4,rad:[2.97,3.05],rot:Math.PI/4,top:(c,w,h)=>{R(c,800,0,0,w,h);R(c,900,8,8,24,24);R(c,700,32,32,24,24);R(c,950,32,8,24,24);R(c,950,8,32,24,24);},

  blu:{seg:12,rad:[2.2,2.3],rot:0,top:(c,w,h)=>{R(c,900,0,0,w,h);c.strokeStyle=B.pal[700];c.lineWidth=3;c.beginPath();c.arc(32,32,24,0,Math.PI*2);c.stroke();R(c,500,31,5,3,6);},
    floor:(c,w,h)=>{R(c,950,0,0,w,h);R(c,900,0,0,10,h);R(c,800,16,0,3,h);}}
};
function pedestal(){
  const s=STAGE[B.key];
  const side=M(T(128,16,(c,w,h)=>{R(c,800,0,0,w,h);R(c,B.key==='blu'?500:700,0,0,w,3);R(c,950,0,h-2,w,2);for(let x=0;x<w;x+=16)R(c,950,x,0,2,h);}));

const scene=new THREE.Scene();scene.background=new THREE.Color('#0D0100');
const camera=new THREE.PerspectiveCamera(42,4/3,0.1,80);
const lightW=new THREE.Vector3(-0.55,0.75,0.65).normalize();
const worlds={};
function triCount(o){let n=0;o.traverse(m=>{if(m.isMesh){const gm=m.geometry;n+=(gm.index?gm.index.count:gm.attributes.position.count)/3;}});return Math.round(n);}

function build(){
  BORDER.forEach(bk=>{
    B=BR[bk];const w={group:new THREE.Group(),items:{}};scene.add(w.group);
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(64,64,32,32),M(T(32,32,STAGE[bk].floor),[32,32]));fl.rotation.x=-Math.PI/2;fl.position.y=-0.36;w.group.add(fl);
    DATA[bk].order.forEach(k=>{const root=new THREE.Group(),spin=BUILD[k]();spin.rotation.y=0.55;root.add(spin);root.add(pedestal());w.group.add(root);
      w.items[k]={root,spin,tris:triCount(spin)};});

  });
  B=BR.red;apply();
}

/* ---------- state + UI ---------- */
const $=id=>document.getElementById(id);
const cur={red:'pain',gld:'success',grn:'growth',blu:'knowledge'};
let brand='red',lineup=false,spinOn=!matchMedia('(prefers-reduced-motion: reduce)').matches,hi=false;
let theta=0,phi=0.12,dragging=false,lx=0,ly=0;
function setPressed(el,v){el.setAttribute('aria-pressed',v?'true':'false');}

const brandBox=$('brands');
BORDER.forEach(bk=>{const b=BR[bk],btn=document.createElement('button');btn.className='brand';btn.id='brand-'+bk;btn.dataset.b=bk;
  btn.style.setProperty('--s',b.pal[500]);btn.style.setProperty('--bg',b.pal[900]);btn.style.setProperty('--bd',b.pal[700]);
  btn.innerHTML=b.name+'<small>'+b.corp+'</small>';btn.onclick=()=>{brand=bk;renderTabs();apply();};brandBox.appendChild(btn);});
function renderTabs(){const t=$('tabs');t.innerHTML='';DATA[brand].order.forEach(k=>{const b=document.createElement('button');b.className='tab';b.id='tab-'+k;b.dataset.p=k;b.textContent=k.toUpperCase();
  b.onclick=()=>{cur[brand]=k;apply();};t.appendChild(b);});}

function fitName(){const h=$('s-name'),max=104;h.style.fontSize=max+'px';const avail=h.parentElement.clientWidth-48;let s=max;
  while(h.scrollWidth>avail&&s>36){s-=4;h.style.fontSize=s+'px';}}

function apply(){
  const b=BR[brand],w=worlds[brand],k=cur[brand],d=DATA[brand][k];
  const root=document.documentElement.style;
  [950,900,800,700,600,500,400,300,200,100].forEach(n=>root.setProperty('--b'+n,b.pal[n]));
  Object.entries(b.css).forEach(([n,v])=>root.setProperty('--'+n,v));
  $('logo').src=LOGO_SRC[brand];$('logo').alt=b.name+' logo';
  document.querySelectorAll('.brand').forEach(x=>setPressed(x,x.dataset.b===brand));
  document.querySelectorAll('.tab').forEach(x=>setPressed(x,x.dataset.p===k));
  BORDER.forEach(bk=>{if(worlds[bk])worlds[bk].group.visible=bk===brand;});
  scene.background.set(b.pal[950]);U.uFogColor.value.set(b.pal[950]);
  U.uShadowAmt.value=b.shadow?1:0;if(b.shadow)U.uShadowCol.value.set(b.shadow);U.uJitter.value=b.jitter||0;
  const order=DATA[brand].order;
  if(w)order.forEach((key,i)=>{const it=w.items[key];it.root.visible=lineup||key===k;it.root.position.x=lineup?(i-1)*5.6:0;});
  $('s-name').textContent=k.toUpperCase();$('s-lot').textContent=d.lot;$('s-tag').textContent=d.tag;
  $('s-item').textContent=d.item;$('s-fx').textContent=d.fx;$('s-warn').innerHTML=d.warn;
  const tris=w?w.items[k].tris:0,ncol=Object.keys(b.pal).length;
  $('s-model').textContent=tris+' triangles, flat Gouraud shading, '+ncol+'-color '+b.corp.charAt(0)+b.corp.slice(1).toLowerCase()+' palette.';
  $('hud-name').textContent=b.name+' // '+(lineup?'LINEUP':k.toUpperCase());
  $('hud-tris').textContent='TRIS '+(lineup&&w?order.reduce((s,key)=>s+w.items[key].tris,0):tris);
  const W=hi?640:320,H=hi?480:240;$('hud-res').textContent=W+'×'+H+' // 15-BIT';
  $('s-specs').innerHTML=b.note+'<br>Target <span>'+W+'×'+H+'</span> · textures <span>≤128px</span>, nearest filter, no mipmaps<br>'+
    'Vertex snap <span>'+(U.uSnap.value?'on':'off')+'</span> · affine UVs <span>'+(U.uAffine.value?'on':'off')+'</span> · Bayer dither <span>'+(U.uDither.value?'on':'off')+'</span>'+
    (b.jitter?' · vertex drift <span>always on</span>':'')+(b.shadow?' · shadow tint <span>Purple-700</span>':'');

  renderer.setSize(W,H,false);U.uRes.value.set(W,H);U.uFogNear.value=lineup?16:10;U.uFogFar.value=lineup?42:26;

}
$('t-spin').onclick=()=>{spinOn=!spinOn;apply();};
$('t-line').onclick=()=>{lineup=!lineup;apply();};
$('t-res').onclick=()=>{hi=!hi;apply();};
$('t-wob').onclick=()=>{U.uSnap.value=U.uSnap.value?0:1;apply();};
$('t-aff').onclick=()=>{U.uAffine.value=U.uAffine.value?0:1;apply();};
$('t-dit').onclick=()=>{U.uDither.value=U.uDither.value?0:1;apply();};
window.addEventListener('resize',fitName);

cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!dragging)return;theta-=(e.clientX-lx)*0.008;phi=Math.max(-0.08,Math.min(0.75,phi+(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;});
const end=()=>{dragging=false;};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

let last=performance.now(),clock=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;U.uTime.value=clock;
  const w=worlds[brand];
  if(w){const it=w.items[cur[brand]];if(spinOn&&!dragging)it.spin.rotation.y+=dt*0.6;
    DATA[brand].order.forEach(k=>{const a=w.items[k].spin.userData.anim;if(a&&w.items[k].root.visible)a(clock);});}
  const r=lineup?18:8.6,ty=lineup?1.6:1.75;
  camera.position.set(Math.sin(theta)*Math.cos(phi)*r,ty+Math.sin(phi)*r,Math.cos(theta)*Math.cos(phi)*r);
  camera.lookAt(0,ty,0);camera.updateMatrixWorld();
  U.uLight.value.copy(lightW).transformDirection(camera.matrixWorldInverse);
  renderer.render(scene,camera);requestAnimationFrame(frame);
}

renderTabs();
const faces=['900 48px "Barlow Condensed"','700 12px "Barlow Condensed"','800 12px "Barlow Condensed"','400 40px "Bebas Neue"','italic 700 20px "Cormorant Garamond"',
  '500 16px "DM Sans"','700 16px "DM Sans"','500 16px "DM Mono"','700 12px "Space Mono"'];
const fontsReady=Promise.race([Promise.all(faces.map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]).catch(()=>{});
const logosReady=Promise.all(Object.values(BR).map(b=>new Promise(r=>{if(b.img.complete)r();else{b.img.onload=r;b.img.onerror=r;}})));
Promise.all([fontsReady,logosReady]).then(()=>{build();requestAnimationFrame(frame);});
})();
</script>
